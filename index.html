<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Shelf | 文档切换器</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #71808c;
      --line: #dfe6e7;
      --paper: #fbfaf6;
      --cream: #f2eee5;
      --green: #2e6b5a;
      --green-soft: #e4f0e9;
      --orange: #d86f35;
      --shadow: 0 24px 60px rgba(39, 57, 54, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #e7ece8;
      font-family: Georgia, "Noto Serif SC", serif;
    }

    button { font: inherit; }

    .app-shell {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 42px 0 54px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      font-weight: 400;
      letter-spacing: -.04em;
      line-height: .98;
    }

    .masthead-note {
      max-width: 230px;
      margin: 0 0 3px;
      color: var(--muted);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .workspace {
      display: grid;
      grid-template-columns: 250px 1fr;
      min-height: 670px;
      overflow: hidden;
      border: 1px solid rgba(65, 82, 77, .15);
      border-radius: 14px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 28px 18px;
      background: #f0f3ee;
      border-right: 1px solid var(--line);
    }

    .sidebar-label {
      padding: 0 12px;
      color: var(--muted);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .file-list {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .file-button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      color: #60706f;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .file-button:hover { color: var(--green); background: rgba(255, 255, 255, .7); transform: translateX(2px); }
    .file-button[aria-selected="true"] { color: var(--ink); background: #fff; box-shadow: 0 5px 15px rgba(39, 57, 54, .07); }

    .file-icon {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      margin-right: 11px;
      border-radius: 7px;
      color: #fff;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -.06em;
    }

    .file-icon.text { background: #8e9ba2; }
    .file-icon.sql { background: #3f7890; }
    .file-icon.notebook { background: #cb8a36; }
    .file-icon.py { background: #4b805e; }
    .file-icon.html { background: #c96142; }

    .file-name { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .file-ext { display: block; margin-top: 2px; color: #95a09f; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 400; }

    .sidebar-footer {
      margin: 44px 12px 0;
      padding-top: 16px;
      border-top: 1px solid #d7e0db;
      color: #8a9793;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      line-height: 1.6;
    }

    .content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 31px 38px 38px;
    }

    .content-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .file-title {
      margin: 0;
      font-size: 29px;
      font-weight: 400;
      letter-spacing: -.03em;
    }

    .file-description { margin: 7px 0 0; color: var(--muted); font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 99px;
      color: var(--green);
      background: var(--green-soft);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status::before { width: 6px; height: 6px; border-radius: 50%; background: #5eaa76; content: ""; }

    .code-window {
      display: flex;
      min-height: 490px;
      flex: 1;
      flex-direction: column;
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid #dbe2df;
      border-radius: 9px;
      background: #f7f8f5;
    }

    .window-bar { display: flex; align-items: center; gap: 6px; padding: 12px 16px; border-bottom: 1px solid #e4e9e5; background: #f1f3ef; }
    .window-dot { width: 8px; height: 8px; border-radius: 50%; background: #d8aaa1; }
    .window-dot:nth-child(2) { background: #dcc587; }
    .window-dot:nth-child(3) { background: #9ebea0; }
    .window-path { margin-left: auto; color: #9aa5a0; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; }

    pre { margin: 0; padding: 25px 28px 30px; overflow: auto; color: #293537; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
    .line-number { display: inline-block; width: 32px; margin-right: 18px; color: #b6bfba; user-select: none; text-align: right; }
    .syntax-keyword { color: #a24f61; }
    .syntax-string { color: #5c815c; }
    .syntax-comment { color: #98a49c; font-style: italic; }
    .syntax-function { color: #3b7181; }
    .syntax-number { color: #aa7143; }

    .content-footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 14px; color: #98a29f; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11px; }

    @media (max-width: 760px) {
      .app-shell { width: min(100% - 28px, 600px); padding-top: 25px; }
      .masthead { align-items: flex-start; flex-direction: column; gap: 14px; }
      .masthead-note { max-width: 320px; text-align: left; }
      .workspace { display: block; min-height: auto; }
      .sidebar { padding: 20px 14px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .file-list { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
      .file-button { align-items: center; flex-direction: column; padding: 9px 4px; text-align: center; }
      .file-icon { margin: 0 0 6px; }
      .file-name { overflow: hidden; max-width: 100%; font-size: 11px; text-overflow: ellipsis; }
      .file-ext, .sidebar-footer { display: none; }
      .content { padding: 24px 18px 22px; }
      .content-header { align-items: flex-start; flex-direction: column; gap: 12px; }
      .file-title { font-size: 25px; }
      .code-window { min-height: 400px; }
      pre { padding: 20px 13px; font-size: 11px; }
      .line-number { width: 25px; margin-right: 10px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">A small document library</p>
        <h1>File Shelf</h1>
      </div>
      <p class="masthead-note">在五种格式之间切换，快速浏览每份文档的内容。</p>
    </header>

    <section class="workspace" aria-label="文件浏览器">
      <aside class="sidebar">
        <div class="sidebar-label">Documents / 05</div>
        <nav class="file-list" aria-label="文件类型">
          <button class="file-button" type="button" data-file="text" aria-selected="true">
            <span class="file-icon text">TXT</span><span><span class="file-name">readme</span><span class="file-ext">.txt</span></span>
          </button>
          <button class="file-button" type="button" data-file="sql" aria-selected="false">
            <span class="file-icon sql">SQL</span><span><span class="file-name">insights</span><span class="file-ext">.sql</span></span>
          </button>
          <button class="file-button" type="button" data-file="notebook" aria-selected="false">
            <span class="file-icon notebook">NB</span><span><span class="file-name">explore</span><span class="file-ext">.ipynb</span></span>
          </button>
          <button class="file-button" type="button" data-file="py" aria-selected="false">
            <span class="file-icon py">PY</span><span><span class="file-name">pipeline</span><span class="file-ext">.py</span></span>
          </button>
          <button class="file-button" type="button" data-file="html" aria-selected="false">
            <span class="file-icon html">HTML</span><span><span class="file-name">landing</span><span class="file-ext">.html</span></span>
          </button>
        </nav>
        <p class="sidebar-footer">选择一个文件类型<br>查看对应的示例内容。</p>
      </aside>

      <section class="content" aria-live="polite">
        <div class="content-header">
          <div><h2 class="file-title" id="file-title">readme.txt</h2><p class="file-description" id="file-description">一段简短的项目说明。</p></div>
          <div class="status">已同步</div>
        </div>
        <div class="code-window">
          <div class="window-bar"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span><span class="window-path" id="window-path">~/documents/readme.txt</span></div>
          <pre id="file-content"></pre>
        </div>
        <footer class="content-footer"><span id="file-meta">纯文本 · 6 行</span><span>UTF-8</span></footer>
      </section>
    </section>
  </main>

  <script>
    const documents = {
      text: { file: 'readme.txt', title: 'readme.txt', description: '一段简短的项目说明。', path: '~/documents/readme.txt', meta: '纯文本' },
      sql: { file: 'insights.sql', title: 'insights.sql', description: '从订单表中整理本月的活跃用户。', path: '~/queries/insights.sql', meta: 'SQL 查询' },
      notebook: { file: 'explore.ipynb', title: 'explore.ipynb', description: '用一小段实验记录观察数据趋势。', path: '~/labs/explore.ipynb', meta: 'Notebook' },
      py: { file: 'pipeline.py', title: 'pipeline.py', description: '一个负责清洗记录并生成摘要的函数。', path: '~/scripts/pipeline.py', meta: 'Python' },
      html: { file: 'landing.html', title: 'landing.html', description: '一个清爽的欢迎页骨架。', path: '~/site/landing.html', meta: 'HTML' }
    };

    const title = document.querySelector('#file-title');
    const description = document.querySelector('#file-description');
    const path = document.querySelector('#window-path');
    const content = document.querySelector('#file-content');
    const meta = document.querySelector('#file-meta');

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function highlight(line, type) {
      let escaped = escapeHtml(line);
      if (type === 'html') {
        escaped = escaped.replace(/(&lt;\/?)([\w-]+)/g, "$1<span class='syntax-keyword'>$2</span>");
        escaped = escaped.replace(/([\w-]+)(=)/g, "<span class='syntax-function'>$1</span>$2");
      }
      if (type === 'sql') {
        escaped = escaped.replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|AS|DESC)\b/g, "<span class='syntax-keyword'>$1</span>");
        escaped = escaped.replace(/\b(COUNT|SUM)\b/g, "<span class='syntax-function'>$1</span>");
        escaped = escaped.replace(/('[^']*')/g, "<span class='syntax-string'>$1</span>");
      }
      if (type === 'py' || type === 'notebook') {
        escaped = escaped.replace(/\b(import|from|as|def|for|in|if|return|True|False|class)\b/g, "<span class='syntax-keyword'>$1</span>");
        escaped = escaped.replace(/(\"\"\".*?\"\"\"|'.*?')/g, "<span class='syntax-string'>$1</span>");
        escaped = escaped.replace(/(#.*$)/g, "<span class='syntax-comment'>$1</span>");
        escaped = escaped.replace(/\b(\d+)\b/g, "<span class='syntax-number'>$1</span>");
      }
      return escaped;
    }

    async function renderDocument(type) {
      const file = documents[type];
      title.textContent = file.title;
      description.textContent = file.description;
      path.textContent = file.path;
      content.textContent = '正在读取文件...';
      const response = await fetch(file.file);
      if (!response.ok) throw new Error(`无法读取 ${file.file}`);
      const rawContent = await response.text();
      const source = type === 'notebook' ? JSON.stringify(JSON.parse(rawContent), null, 2) : rawContent;
      const lines = source.replace(/\n$/, '').split('\n');
      meta.textContent = `${file.meta} · ${lines.length} 行`;
      content.innerHTML = lines.map((line, index) => `<span class="line-number">${String(index + 1).padStart(2, '0')}</span>${highlight(line, type)}`).join('\n');
      document.querySelectorAll('.file-button').forEach((button) => {
        button.setAttribute('aria-selected', String(button.dataset.file === type));
      });
    }

    document.querySelectorAll('.file-button').forEach((button) => {
      button.addEventListener('click', () => renderDocument(button.dataset.file).catch(showError));
    });

    function showError(error) {
      content.textContent = error.message;
      meta.textContent = '读取失败';
    }

    renderDocument('text').catch(showError);
  </script>
</body>
</html>
